<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maksym.is-a.dev</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #0b0c10;
      color: #e8e8ea;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 8vw, 4rem); font-weight: 600; letter-spacing: -0.02em; }
    h1 .accent { color: #6c7afd; }
    p { margin-top: 1rem; color: #8b8d98; font-size: 0.95rem; }
    .cursor { display: inline-block; width: 0.6ch; height: 1em; background: #6c7afd; vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>maksym<span class="accent">.is-a.dev</span></h1>
    <p>coming soon<span class="cursor"></span></p>
  </main>
</body>
</html>
